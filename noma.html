<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dekorāciju noma | Garāžas Studija</title><link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="style.css"><style>main{max-width:1100px;margin:45px auto;padding:20px}.rent{border:1px solid #ddd;border-radius:12px;padding:20px;margin:18px 0;display:grid;grid-template-columns:200px 1fr;gap:22px}.rent img{width:100%;height:190px;object-fit:cover}.calendar{display:flex;flex-wrap:wrap;gap:6px}.day{border:1px solid #ddd;border-radius:6px;padding:7px;min-width:44px;text-align:center}.busy{background:#ead7d3}.free{background:#d9e9dc}@media(max-width:650px){.rent{grid-template-columns:1fr}}</style></head><body><main><p><a href="index.html">← Garāžas Studija</a></p><h1>Dekorāciju noma</h1><p>Apskati dekorācijas un to pieejamību. Rezervācijai sazinies ar mums.</p><label>Kalendāra mēnesis <input id="month" type="month"></label><div id="items">Ielādē…</div></main><script>const month=document.querySelector('#month'),items=document.querySelector('#items');month.value=new Date().toISOString().slice(0,7);let data=[];fetch('data/noma.json').then(r=>r.json()).then(j=>{data=j;render()}).catch(()=>items.textContent='Nomas informācija pagaidām nav pieejama.');month.onchange=render;function render(){items.replaceChildren();if(!data.length){items.textContent='Nomas piedāvājums drīzumā.';return}for(const item of data){let wrap=document.createElement('article');wrap.className='rent';if(item.image&&/^img\/[a-zA-Z0-9_./-]+$/.test(item.image)){let img=document.createElement('img');img.src=item.image;img.alt=item.name;wrap.append(img)}let info=document.createElement('div');let h=document.createElement('h2');h.textContent=item.name;info.append(h);let p=document.createElement('p');p.textContent=item.description||'';info.append(p);if(item.price){let price=document.createElement('p');price.textContent='Cena: '+item.price+' € / dienā';info.append(price)}let cal=document.createElement('div');cal.className='calendar';let [y,m]=month.value.split('-').map(Number),count=new Date(y,m,0).getDate();for(let d=1;d<=count;d++){let date=month.value+'-'+String(d).padStart(2,'0'),busy=(item.busy||[]).includes(date),cell=document.createElement('span');cell.className='day '+(busy?'busy':'free');cell.title=busy?'Aizņemts':'Pieejams';cell.textContent=d;cal.append(cell)}info.append(cal);let legend=document.createElement('p');legend.textContent='Zaļš — pieejams · Sarkans — aizņemts';info.append(legend);wrap.append(info);items.append(wrap)}} </script></body></html>
